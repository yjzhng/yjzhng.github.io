# Each entry is a project tile on the PROJECTS page.
#   title    – tile heading
#   blurb    – one-line description
#   section  – tiles are grouped under a heading per section (in first-seen order)
#   url      – main click target for the tile (optional; defaults to repo)
#   icon     – app icon, path under /images/ (optional)
#   repo     – GitHub link shown with the icon at the bottom of the tile (optional)
#   repo_name – override the text next to the GitHub icon (optional)
#
# Apps published on open-bioware point `url` at their page there and carry an
# `icon`. Unreleased ones have neither until they go public.

# - title: "Comming soon"
#   blurb: "..."
#   section: "ChemBio tools"
#   url:
#   repo: "https://github.com/yjzhng/coming-soon"


- title: "BioGrapher"
  blurb: "Open-source data processing and plotting app for biologists"
  section: "Biology tools"
  url: "https://yjzhng.github.io/open-bioware/apps/biographer/"
  # Icon from build/icon.png in the repo, cropped to the artwork and scaled to 256.
  # Equivalent to the one now on the app page, from a higher-resolution source.
  icon: "apps/biographer.png"
  repo: "https://github.com/yjzhng/BioGrapher"

- title: "OmicExplorer"
  blurb: "Intuitive workflow editor for omic analysis and visualisation pipelines"
  section: "Biology tools"
  url: "https://yjzhng.github.io/open-bioware/apps/omicexplorer/"
  # Icon predates the open-bioware page and came from build-resources/icon.png in
  # the repo, cropped to the artwork (that source carries transparent padding the
  # other icons lack) and scaled to 256. Matches the icon now on the app page.
  icon: "apps/omicexplorer.png"
  repo: "https://github.com/yjzhng/OmicExplorer"

